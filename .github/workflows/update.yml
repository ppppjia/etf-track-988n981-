name: Daily ETF Portfolio Update

on:
  schedule:
    - cron: '00 08 * * *' # 每天 (台北時間 18:00) 執行
  workflow_dispatch: # 允許您在 GitHub 網頁上手動點擊執行測試

permissions:
  contents: write # 賦予 GitHub Action 寫入與推送代碼回倉庫的權限

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run Downloader
        run: |
          python downloader.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 檢查是否有檔案變更，如果有則 commit 並 push
          if [ -n "$(git status --porcelain)" ]; then
            git add data/
            git commit -m "🤖 自動更新：$(date +'%Y-%m-%d') 投組數據"
            git push
          else
            echo "沒有檢測到新資料變更，跳過推送。"
          fi
